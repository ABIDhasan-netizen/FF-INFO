<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Fire UID অনুসন্ধান</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    input, button { font-size: 16px; padding: 8px; }
    input { width: 60%; }
    button { cursor: pointer; }
    #result { margin-top: 24px; background: #f4f4f4; padding: 16px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
    .error { color: #b00020; }
    .loading { color: #666; }
  </style>
</head>
<body>
  <h1>Free Fire প্লেয়ার তথ্য অনুসন্ধান</h1>
  <p>একটি UID লিখুন, লাইক সংখ্যা, লেভেল এবং অন্যান্য তথ্য দেখুন।</p>

  <div>
    <input type="text" id="uidInput" placeholder="যেমন: 16868964670" />
    <button id="searchBtn">অনুসন্ধান করুন</button>
  </div>

  <div id="result"></div>

  <script>
    const input = document.getElementById('uidInput');
    const btn = document.getElementById('searchBtn');
    const resultDiv = document.getElementById('result');

    btn.addEventListener('click', async () => {
      const uid = input.value.trim();
      if (!uid) {
        resultDiv.className = 'error';
        resultDiv.textContent = 'অনুগ্রহ করে একটি UID লিখুন';
        return;
      }

      resultDiv.className = 'loading';
      resultDiv.textContent = 'অনুসন্ধান করা হচ্ছে... (প্রথমবার Render জাগাতে প্রায় 1 মিনিট সময় লাগতে পারে, অপেক্ষা করুন)';

      try {
        const res = await fetch(`/api/player/${uid}`);
        const data = await res.json();

        if (!res.ok) {
          resultDiv.className = 'error';
          resultDiv.textContent = data.error || 'অনুসন্ধান ব্যর্থ হয়েছে';
          return;
        }

        resultDiv.className = '';
        // মূল তথ্য সুন্দরভাবে প্রদর্শন করুন
        resultDiv.innerHTML = `
          <h3>${data.nickname || 'অজানা'}</h3>
          <p><strong>UID:</strong> ${data.uid}</p>
          <p><strong>লেভেল:</strong> ${data.level}</p>
          <p><strong>লাইক:</strong> ${data.likes}</p>
          <p><strong>অঞ্চল:</strong> ${data.region || 'অজানা'}</p>
          <p><strong>র‍্যাঙ্ক:</strong> ${data.rank || 'অজানা'}</p>
          <details>
            <summary>সম্পূর্ণ কাঁচা ডেটা দেখুন</summary>
            <pre>${JSON.stringify(data.raw, null, 2)}</pre>
          </details>
        `;
      } catch (err) {
        resultDiv.className = 'error';
        resultDiv.textContent = 'অনুরোধ ব্যর্থ হয়েছে: ' + err.message;
      }
    });
  </script>
</body>
</html>
